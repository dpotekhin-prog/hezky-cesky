services:
  app:
    build:
      context: .
      target: app
    environment:
      # Empty = generated once and stored in the data volume (see docker/entrypoint.sh).
      APP_SECRET: ${APP_SECRET:-}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - app_data:/var/www/app/var/data
      - ./content:/var/www/app/content:ro
    healthcheck:
      # Ready once migrations and the question import are done and FPM listens.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
