log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time "$http_referer"';

server {
    listen 80;
    server_name _;
    root /var/www/app/public;

    access_log /dev/stdout timed;
    error_log /dev/stderr warn;

    server_tokens off;
    client_max_body_size 1m;

    # Security headers (HSTS belongs on the HTTPS server/proxy in front of this one).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Fingerprinted files from AssetMapper never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # index.php lives at the same path inside the app container.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # Any other .php file is not an entry point.
    location ~ \.php$ {
        return 404;
    }
}
