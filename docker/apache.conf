<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/app/public
    PassEnv APP_SECRET DEFAULT_URI
    <Directory /var/www/app/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
