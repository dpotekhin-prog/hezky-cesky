[www]
; Pass container env (APP_SECRET, DEFAULT_URI…) to PHP; FPM drops it by default.
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Keep access logging in nginx only.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
