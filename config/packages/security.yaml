security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                enable_csrf: true
            logout:
                path: app_logout
                target: app_root
                enable_csrf: true
            # 5 failed logins per username+IP (and 5×5 per IP) within 15 minutes, then a pause.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                always_remember_me: true

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/(cs|en)/(login|register|help)$, roles: PUBLIC_ACCESS }
        - { path: ^/(cs|en)/parent, roles: ROLE_PARENT }
        - { path: ^/(cs|en)(/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
