    correct: "z"
    explanation:
      cs: "Ověříme: mrazy → mráz."
      en: "Check with another form: mrazy → mráz."

  # ---------- slovní druhy ----------
  - id: l2-sd-001
    topic: slovni-druhy
    level: 2
    type: choice
    prompt: "Jaký slovní druh je slovo „stůl“?"
    options: ["podstatné jméno", "přídavné jméno", "sloveso"]
    correct: "podstatné jméno"
    explanation:
      cs: "Stůl je věc – ptáme se kdo, co? Je to podstatné jméno."
      en: "\"Stůl\" (table) is a thing (who? what?), so it is a noun."
  - id: l2-sd-002
    topic: slovni-druhy
    level: 2
    type: choice
    prompt: "Jaký slovní druh je slovo „zelený“?"
    options: ["podstatné jméno", "přídavné jméno", "sloveso"]
    correct: "přídavné jméno"
    explanation:
      cs: "Zelený říká, jaká věc je (jaký?). Je to přídavné jméno."
      en: "\"Zelený\" (green) describes what something is like, so it is an adjective."
  - id: l2-sd-003
    topic: slovni-druhy
    level: 2
    type: choice
    prompt: "Jaký slovní druh je slovo „pod“?"
    options: ["předložka", "spojka", "sloveso"]
    correct: "předložka"
    explanation:
      cs: "Pod stojí před podstatným jménem (pod stolem). Je to předložka."
      en: "\"Pod\" (under) stands before a noun (pod stolem), so it is a preposition."
  - id: l2-sd-004
    topic: slovni-druhy
    level: 2
    type: choice
    prompt: "Jaký slovní druh je slovo „a“ ve větě: Mám psa a kočku."
    options: ["předložka", "spojka", "podstatné jméno"]
    correct: "spojka"
    explanation:
      cs: "Slovo a spojuje dvě slova. Je to spojka."
      en: "\"A\" (and) joins two words, so it is a conjunction."
  - id: l2-sd-005
    topic: slovni-druhy
    level: 2
    type: input
    prompt: "Najdi ve větě sloveso a napiš ho: Malý pes rychle běží."
    answers: ["běží"]
    explanation:
      cs: "Běží říká, co pes dělá. Je to sloveso."
      en: "\"Běží\" (runs) tells what the dog does, so it is a verb."
  - id: l2-sd-006
    topic: slovni-druhy
    level: 2
    type: input
    prompt: "Najdi ve větě přídavné jméno a napiš ho: Na stole leží červené jablko."
    answers: ["červené"]
    explanation:
      cs: "Červené říká, jaké je jablko. Je to přídavné jméno."
      en: "\"Červené\" (red) tells what the apple is like, so it is an adjective."

  # ---------- podstatná jména ----------
  - id: l2-pj-001
    topic: podstatna-jmena
    level: 2
    type: choice
    prompt: "Jaký rod má podstatné jméno „město“?"
    options: ["mužský", "ženský", "střední"]
    correct: "střední"
    explanation:
      cs: "Řekneme to město, proto je to rod střední."
      en: "We say \"to město\", so it is neuter."
  - id: l2-pj-002
    topic: podstatna-jmena
    level: 2
    type: choice
    prompt: "Jaký rod má podstatné jméno „kniha“?"
    options: ["mužský", "ženský", "střední"]
    correct: "ženský"
    explanation:
      cs: "Řekneme ta kniha, proto je to rod ženský."
      en: "We say \"ta kniha\", so it is feminine."
  - id: l2-pj-003
    topic: podstatna-jmena
    level: 2
    type: choice
    prompt: "V jakém čísle je podstatné jméno „domy“?"
    options: ["jednotné", "množné"]
    correct: "množné"
    explanation:
      cs: "Domy je více domů, proto je to číslo množné."
      en: "\"Domy\" means more than one house, so it is plural."
  - id: l2-pj-004
    topic: podstatna-jmena
    level: 2
    type: choice
    prompt: "Které slovo je vlastní jméno?"
    options: ["řeka", "Vltava", "hora", "město"]
    correct: "Vltava"
    explanation:
      cs: "Vltava je jméno jedné určité řeky, proto ji píšeme s velkým V."
      en: "\"Vltava\" is the name of one particular river, so it starts with a capital letter."
  - id: l2-pj-005
    topic: podstatna-jmena
    level: 2
    type: choice
    prompt: "Jak správně napíšeš název nejvyšší hory Česka?"
    options: ["Sněžka", "sněžka"]
    correct: "Sněžka"
    explanation:
      cs: "Názvy hor jsou vlastní jména, píšeme je s velkým písmenem."
      en: "Names of mountains are proper nouns, so they start with a capital letter."
  - id: l2-pj-006
    topic: podstatna-jmena
    level: 2
    type: choice
    prompt: "Které spojení je napsané správně?"
    options: ["v Dlouhé ulici", "v dlouhé ulici", "v Dlouhé Ulici"]
    correct: "v Dlouhé ulici"
    explanation:
      cs: "Název ulice je Dlouhá, píšeme ho s velkým D. Slovo ulice píšeme s malým u."
      en: "The street name \"Dlouhá\" gets a capital D; the word \"ulice\" (street) stays lowercase."
  - id: l2-pj-007
    topic: podstatna-jmena
    level: 2
    type: input
    prompt: "Napiš slovo v množném čísle: kočka → ?"
    answers: ["kočky"]
    explanation:
      cs: "Jedna kočka, dvě kočky."
      en: "One cat is \"kočka\", more cats are \"kočky\"."
  - id: l2-pj-008
    topic: podstatna-jmena
    level: 2
    type: input
    prompt: "Napiš slovo v jednotném čísle: stromy → ?"
    answers: ["strom"]
    explanation:
      cs: "Hodně stromů jsou stromy, jeden je strom."
      en: "Many trees are \"stromy\", one tree is \"strom\"."

  # ---------- dě, tě, ně, bě, pě, vě, mě ----------
  - id: l2-dtn-001
    topic: de-te-ne
    level: 2
    type: choice
    prompt: "Doplň ě/e: D_ti si hrají na hřišti."
    options: ["ě", "e"]
    correct: "ě"
    explanation:
      cs: "Slyšíme měkké ď, proto píšeme dě: děti."
      en: "We hear a soft ď, so we write dě: děti (children)."
  - id: l2-dtn-002
    topic: de-te-ne
    level: 2
    type: choice
    prompt: "Doplň ě/e: Po plavání mě bolí celé t_lo."
    options: ["ě", "e"]
    correct: "ě"
    explanation:
      cs: "Slyšíme měkké ť, proto píšeme tě: tělo."
      en: "We hear a soft ť, so we write tě: tělo (body)."
  - id: l2-dtn-003
    topic: de-te-ne
    level: 2
    type: input
    prompt: "Doplň ě nebo je a napiš celé slovo: Ve škole máme ob_d ve 12 hodin."
    answers: ["oběd"]
    explanation:
      cs: "Slyšíme bje, ale píšeme bě: oběd."
      en: "We hear \"bje\", but we write bě: oběd (lunch)."
  - id: l2-dtn-004
    topic: de-te-ne
    level: 2
    type: choice
    prompt: "Doplň ě nebo je: Mám p_t prstů na ruce."
    options: ["ě", "je"]
    correct: "ě"
    explanation:
      cs: "Slyšíme pje, ale píšeme pě: pět."
      en: "We hear \"pje\", but we write pě: pět (five)."
  - id: l2-dtn-005
    topic: de-te-ne
    level: 2
    type: input
    prompt: "Doplň mě nebo mně a napiš celé slovo: Bydlíme ve velkém _stě."
    answers: ["městě"]
    explanation:
      cs: "Ve slově město píšeme mě."
      en: "In the word \"město\" (town) we write mě."
  - id: l2-dtn-006
    topic: de-te-ne
    level: 2
    type: choice
    prompt: "Doplň mě nebo mně: Psali o _ v novinách."
    options: ["mě", "mně"]
    correct: "mně"
    explanation:
      cs: "Zkusíme dosadit tobě: psali o tobě. Kde se hodí tobě, píšeme mně."
      en: "Try \"tobě\": \"psali o tobě\". Where \"tobě\" fits, we write mně."
  - id: l2-dtn-007
    topic: de-te-ne
    level: 2
    type: choice
    prompt: "Které slovo je napsané správně?"
    options: ["vjeděl", "věděl", "vjedel"]
    correct: "věděl"
    explanation:
      cs: "Slyšíme vje a ďe, ale píšeme vě a dě: věděl."
      en: "We hear \"vje\" and \"ďe\", but we write vě and dě: věděl (knew)."

  # ---------- význam slov ----------
  - id: l2-vys-001
    topic: vyznam-slov
    level: 2
    type: choice
    prompt: "Najdi slovo souznačné (stejného významu) ke slovu „malý“."
    options: ["drobný", "velký", "rychlý"]
    correct: "drobný"
    explanation:
      cs: "Malý a drobný znamenají skoro totéž."
      en: "\"Malý\" and \"drobný\" mean almost the same: small."
  - id: l2-vys-002
    topic: vyznam-slov
    level: 2
    type: choice
    prompt: "Najdi slovo opačného významu ke slovu „teplý“."
    options: ["horký", "studený", "mokrý"]
    correct: "studený"
    explanation:
      cs: "Opak slova teplý je studený."
      en: "The opposite of \"teplý\" (warm) is \"studený\" (cold)."
  - id: l2-vys-003
    topic: vyznam-slov
    level: 2
    type: input
    prompt: "Napiš slovo opačného významu: den → ?"
    answers: ["noc"]
    explanation:
      cs: "Opak slova den je noc."
      en: "The opposite of \"den\" (day) is \"noc\" (night)."
  - id: l2-vys-004
    topic: vyznam-slov
    level: 2
    type: input
    prompt: "Napiš slovo opačného významu: rychlý → ?"
    answers: ["pomalý"]
