    prompt: "Doplň z nebo s a napiš celé slovo: Na dvoře stojí naložený vů_."
    answers: ["vůz"]
    explanation:
      cs: "Ověříme: vozy → vůz."
      en: "Check with another form: vozy → vůz."
  - id: l2-par-005
    topic: parove-souhlasky
    level: 2
    type: input
    prompt: "Doplň v nebo f a napiš celé slovo: V ZOO jsme viděli le_."
    answers: ["lev"]
    explanation:
      cs: "Ověříme: lvi, lva → lev."
      en: "Check with another form: lvi → lev."
  - id: l2-par-006
    topic: parove-souhlasky
    level: 2
    type: input
    prompt: "Doplň h nebo ch a napiš celé slovo: Venku padá bílý sní_."
    answers: ["sníh"]
    explanation:
      cs: "Ověříme: sněhu → sníh."
      en: "Check with another form: sněhu → sníh."
  - id: l2-par-007
    topic: parove-souhlasky
    level: 2
    type: choice
    prompt: "Doplň ď/ť: Na podzim sbíráme v lese žalu_."
    options: ["ď", "ť"]
    correct: "ď"
    explanation:
      cs: "Ověříme: žaludy → žaluď."
      en: "Check with another form: žaludy → žaluď."
  - id: l2-par-008
    topic: parove-souhlasky
    level: 2
    type: input
    prompt: "Doplň d nebo t a napiš celé slovo: Kolem zahrady vede dřevěný plo_."
    answers: ["plot"]
    explanation:
      cs: "Ověříme: ploty → plot."
      en: "Check with another form: ploty → plot."
  - id: l2-par-009
    topic: parove-souhlasky
    level: 2
    type: choice
    prompt: "Doplň h/ch: Na zahradě roste zelený hrá_."
    options: ["h", "ch"]
    correct: "ch"
    explanation:
      cs: "Ověříme: hrachu. Slyšíme ch, proto píšeme hrách."
      en: "Check with \"hrachu\": we hear ch, so we write \"hrách\" (peas)."
  - id: l2-par-010
    topic: parove-souhlasky
    level: 2
    type: input
    prompt: "Doplň d nebo t a napiš celé slovo: Na větvi zpívá černý droz_."
    answers: ["drozd"]
    explanation:
      cs: "Ověříme: drozdi. Slyšíme d, proto píšeme drozd."
      en: "Check with \"drozdi\": we hear d, so we write \"drozd\" (thrush)."
  - id: l2-par-011
    topic: parove-souhlasky
    level: 2
