questions:
  # ---------- vyjmenovaná slova ----------
  - id: l2-vs-001
    topic: vyjmenovana-slova
    level: 2
    type: choice
    prompt: "Doplň í/ý: Hrdý král byl plný p_chy."
    options: ["í", "ý"]
