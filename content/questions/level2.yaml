      cs: "Motýl je vyjmenované slovo po M, píšeme ý."
      en: "\"Motýl\" (butterfly) is a listed word after M, so we write ý."
  - id: l2-vs-018
    topic: vyjmenovana-slova
    level: 2
    type: input
    prompt: "Doplň í nebo ý a napiš celé slovo: Dědeček nosí b_lou košili."
    answers: ["bílou"]
    explanation:
      cs: "Bílý není vyjmenované slovo, proto píšeme měkké í."
      en: "\"Bílý\" (white) is not a listed word, so we write soft í."

  # ---------- párové souhlásky ----------
  - id: l2-par-001
    topic: parove-souhlasky
    level: 2
    type: input
    prompt: "Doplň b nebo p a napiš celé slovo: Na kopci roste starý du_."
    answers: ["dub"]
    explanation:
      cs: "Ověříme: duby → dub."
      en: "Check with another form: duby → dub."
  - id: l2-par-002
    topic: parove-souhlasky
    level: 2
    type: choice
    prompt: "Doplň d/t: Rybník v zimě pokryl le_."
    options: ["d", "t"]
    correct: "d"
    explanation:
      cs: "Ověříme: ledy, ledu → led."
      en: "Check with another form: ledy → led."
  - id: l2-par-003
    topic: parove-souhlasky
    level: 2
    type: choice
    prompt: "Doplň ž/š: Na hradě stojí vysoká vě_."
    options: ["ž", "š"]
    correct: "ž"
    explanation:
      cs: "Ověříme: věže. Slyšíme ž, proto píšeme věž."
      en: "Check with \"věže\": we hear ž, so we write \"věž\" (tower)."
  - id: l2-par-004
    topic: parove-souhlasky
    level: 2
